*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Tajawal',system-ui,sans-serif;color:var(--text);background:radial-gradient(600px 400px at 90% -10%,#3a2a8f 0%,transparent 60%),radial-gradient(500px 400px at -10% 110%,#5a1e5e 0%,transparent 55%),var(--bg);

button,input{font-family:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header img{width:44px;height:44px;border-radius:12px}

.in:focus{outline:none;border-color:var(--amber)}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.avs button{border:none;border-radius:14px;background:#ffffff10;font-size:28px;padding:8px 0}
.avs button.sel{background:var(--violet);box-shadow:0 0 0 3px #fff3}
.go{border:none;border-radius:16px;padding:16px;font-size:20px;font-weight:800;width:100%;background:linear-gradient(90deg,var(--coral),var(--amber));color:#2a1200}
.err{color:var(--coral);text-align:center;margin-top:10px;min-height:20px;font-weight:700}

#view{flex:1;display:flex;flex-direction:column;min-height:0}
.who{display:flex;align-items:center;gap:8px;justify-content:center;font-size:16px;color:var(--dim);margin-bottom:10px}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:17px;flex:none}
.center{margin:auto;text-align:center;padding:10px 0}
.big{font-size:72px;line-height:1.1}

.o0{background:#e8466b}.o1{background:#3e7bfa}.o2{background:#f2a516}.o3{background:#1fb589}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px;overflow:auto}

body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}

@media (min-width:700px){
  body{align-items:center;padding-left:24px;padding-right:24px}
  header,#app,footer{width:100%;max-width:640px}
  header img{width:56px;height:56px}header .t{font-size:30px}
  .big{font-size:110px}.ph-title{font-size:30px}.ph-dim{font-size:19px}

.tbtn .tchip.me{box-shadow:0 0 0 2px #fff}
.tbtn .tempty{color:var(--dim);font-size:14px;font-weight:500}
.tbtn.sel{background:var(--c)!important;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 45%,transparent)}
.tbtn.sel .tname{color:#fff}.tbtn.sel .tchip{background:#fff;color:#1b1540}
@media (min-width:700px){.tbtn .tname{font-size:28px}.tbtn .tchip{font-size:19px}}
*{touch-action:manipulation}
canvas[data-ph-canvas]{touch-action:none!important}

<body>
<header><img src="logo.webp" alt=""><div class="t">جَمعة</div><div class="r" id="roomTag"></div></header>
<div id="app"></div>
<div class="offline" id="offline">انقطع الاتصال… نحاول نرجع</div>
<footer dir="ltr">© 2026 WAEL — Jamaa</footer>
<script>
"use strict";
/* جَمعة · W-Party — phone controller — © 2026 WAEL. All rights reserved. */
const FB_CONFIG = {apiKey: "AIzaSyCS4Ma_0YzpzDxoXVqNpY71ZVJjCJQpaUU", authDomain: "jamaa-3b3e9.firebaseapp.com", databaseURL: "https://jamaa-3b3e9-default-rtdb.europe-west1.firebasedatabase.app", projectId: "jamaa-3b3e9", storageBucket: "jamaa-3b3e9.firebasestorage.app", messagingSenderId: "186594515809", appId: "1:186594515809:web:48a3133bd4a4b37fe74320"};
const AVATARS = ["🦊","🐼","🐯","🦁","🐸","🐵","🦄","🐙","🐧","🐨"];
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
let db, roomRef, ROOM = "", pid = "", avatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
const fields = {};               // typed text per input field (survives view refreshes)
let lastHtml = "";

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function cleanCode(c) { return String(c || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 8); }

// ---------------------------------------------------------- start
function start() {
  if (!window.firebase) { app.innerHTML = `<div class="card center"><div class="big">📶</div><h2>ما فيه اتصال</h2><p class="sub">تأكد من الإنترنت وحدّث الصفحة</p></div>`; return; }
  firebase.initializeApp(FB_CONFIG); db = firebase.database();
  db.ref(".info/connected").on("value", s => { $("#offline").style.display = s.val() === false && pid ? "block" : "none"; });
  const code = cleanCode(new URLSearchParams(location.search).get("r"));
  if (code) openRoom(code); else askCode();
}
function askCode(msg) {
  app.innerHTML = `<div class="card" style="margin:auto 0"><h2>ادخل رمز الغرفة</h2><p class="sub">الرمز مكتوب على شاشة التلفزيون</p>
    <input class="in" id="code" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABCD" style="direction:ltr;letter-spacing:6px;font-size:28px">
    <div style="height:12px"></div><button class="go" id="goCode">دخول</button><div class="err">${msg || ""}</div></div>`;
  const go = () => { const c = cleanCode($("#code").value); if (c.length >= 4) openRoom(c); };
  $("#goCode").onclick = go; $("#code").onkeydown = e => { if (e.key === "Enter") go(); };
}
async function openRoom(code) {
  app.innerHTML = `<div class="center"><div class="big">⏳</div><p class="sub">جاري الاتصال بالغرفة…</p></div>`;
  let meta;
  try { meta = (await db.ref("rooms/" + code + "/meta").get()).val(); } catch (e) { meta = null; }
  if (!meta) { askCode("ما لقينا غرفة بهذا الرمز — تأكد من الرمز اللي على التلفزيون"); return; }
  ROOM = code; roomRef = db.ref("rooms/" + code); $("#roomTag").textContent = code;
  history.replaceState(null, "", location.pathname + "?r=" + code);
  roomRef.child("meta").on("value", s => {
    const m = s.val();
    if (!m) { pid = ""; tvBanner(false); app.innerHTML = `<div class="card center" style="margin:auto 0"><div class="big">📺</div><h2>انتهت الجلسة</h2><p class="sub">التلفزيون قفل الغرفة. صوّر الباركود الجديد من الشاشة.</p></div>`; return; }
    tvBanner(m.online === false);   // TV dropped for a moment: keep everyone in and just wait
  });
  const saved = store("jamaa-pid-" + code);
  if (saved && (await roomRef.child("players/" + saved).get()).exists()) { pid = saved; listen(); return; }
  joinForm();
}
function joinForm() {
  const last = store("jamaa-name") || "";
  app.innerHTML = `<div class="card" style="margin:auto 0"><h2>أهلاً بك في جَمعة 🎉</h2><p class="sub">اكتب اسمك واختر شخصيتك</p>
    <input class="in" id="nm" maxlength="14" placeholder="اسمك" value="${last.replace(/"/g, "")}">
    <div class="avs">${AVATARS.map(a => `<button data-av="${a}" class="${a === avatar ? "sel" : ""}">${a}</button>`).join("")}</div>
    <button class="go" id="join">انضم للعبة</button><div class="err" id="err"></div></div>`;
  app.querySelectorAll("[data-av]").forEach(b => b.onclick = () => { avatar = b.dataset.av; app.querySelectorAll("[data-av]").forEach(x => x.classList.toggle("sel", x === b)); });
  const join = async () => {
    const name = $("#nm").value.trim().slice(0, 14);
    if (!name) { $("#err").textContent = "اكتب اسمك"; $("#nm").focus(); return; }
    $("#join").disabled = true;
    pid = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    try {
      await roomRef.child("players/" + pid).set({name, avatar, t: Date.now()});
      store("jamaa-pid-" + ROOM, pid); store("jamaa-name", name);
      listen();
    } catch (e) { $("#err").textContent = "ما قدرنا ننضم، جرّب مرة ثانية"; $("#join").disabled = false; }
  };
  $("#join").onclick = join; $("#nm").onkeydown = e => { if (e.key === "Enter") join(); };
}

// ---------------------------------------------------------- views from the TV
function tvBanner(on) {
  let b = document.getElementById("tvOff");
  if (!on) { if (b) b.remove(); return; }
  if (b) return;
  b = document.createElement("div"); b.id = "tvOff";
  b.style.cssText = "position:fixed;inset:auto 12px 12px 12px;z-index:50;background:#2a2150;border:1px solid #ffffff22;border-radius:16px;padding:12px 14px;text-align:center;font-weight:700;box-shadow:0 10px 30px #0008";
  b.textContent = "📺 التلفزيون انقطع اتصاله لحظة… لا تطلع، بيرجع تلقائياً";
  document.body.appendChild(b);
}
let pRef = null;
function listen() {
  if (pRef) pRef.off();
  pRef = roomRef.child("players/" + pid);
  let seen = false;
  pRef.on("value", s => {   // removed from the TV (deleted or joined again with the same name elsewhere)
    if (s.exists()) { seen = true; return; }
    if (!seen) return;
    pRef.off(); roomRef.child("views/" + pid).off(); pid = ""; lastHtml = ""; store("jamaa-pid-" + ROOM, "");
    joinForm();
    const e = $("#err"); if (e) e.textContent = "تم حذفك من اللاعبين — تقدر تنضم من جديد";
  });
  app.innerHTML = `<div id="view"><div class="center"><div class="big">${avatar}</div><div class="ph-title">أنت في الغرفة ✅</div><div class="ph-dim">انتظر التلفزيون…</div></div></div>`;
  roomRef.child("views/" + pid).on("value", s => { const v = s.val(); if (v && typeof v.h === "string") show(v.h); });
}
function send(a, v, extra) {
  if (!roomRef || !pid) return;
  roomRef.child("actions").push(Object.assign({pid, a, v: v == null ? null : String(v), t: Date.now()}, extra || {}));
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) { }
}
function show(html) {
  if (html === lastHtml) return;
  lastHtml = html;
  const view = $("#view"); if (!view) return;
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.phoneInput : null;
  view.innerHTML = html;
  view.querySelectorAll("[data-phone-input]").forEach(inp => {
    const f = inp.dataset.phoneInput;
    inp.value = fields[f] || "";
    inp.addEventListener("input", () => { fields[f] = inp.value; });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act(inp.dataset.enter); } });
    if (focused === f) inp.focus();
  });
  const cv = view.querySelector("[data-ph-canvas]");
  if (cv) setupCanvas(cv);
}
function act(a, v) {
  const inp = $("#view [data-phone-input]");
  if (inp && (a === inp.dataset.enter || a === "lie" || a === "guess")) {
    const f = inp.dataset.phoneInput, x = (fields[f] || "").trim();
    if (!x) { inp.focus(); return; }
    send(a, v, {f, x}); fields[f] = ""; inp.value = "";
    return;
  }
  if (a === "undo") { localOps.pop(); repaint(); }
  if (a === "clear") { localOps = []; repaint(); }
  send(a, v);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ph-act]"); if (!b || !$("#view")) return;
  e.preventDefault(); act(b.dataset.phAct, b.dataset.v);
});

// ---------------------------------------------------------- drawing (the drawer's phone)
let localOps = [], wordId = null, canvas = null;
function strokeSeg(ctx, op, from) {
  const W = ctx.canvas.width, H = ctx.canvas.height, pts = op.p, s = Math.max(0, from - 1);
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = op.c; ctx.lineWidth = op.w * (W / 300);
  ctx.beginPath(); ctx.moveTo(pts[s][0] * W, pts[s][1] * H);
  if (pts.length === 1) ctx.lineTo(pts[0][0] * W + .1, pts[0][1] * H);
  for (let i = s + 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * W, pts[i][1] * H);
  ctx.stroke();
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function floodFill(ctx, fx, fy, hex) {
  const W = ctx.canvas.width, H = ctx.canvas.height, x0 = Math.floor(fx * W), y0 = Math.floor(fy * H);
  if (x0 < 0 || y0 < 0 || x0 >= W || y0 >= H) return;
  const img = ctx.getImageData(0, 0, W, H), d = img.data, [r1, g1, b1] = hexRgb(hex);
  const i0 = (y0 * W + x0) * 4, r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2];
  if (Math.abs(r0 - r1) + Math.abs(g0 - g1) + Math.abs(b0 - b1) < 12) return;
  const match = p => { const k = p * 4; return Math.abs(d[k] - r0) + Math.abs(d[k + 1] - g0) + Math.abs(d[k + 2] - b0) <= 110; };
  const seen = new Uint8Array(W * H), stack = [x0, y0];
  while (stack.length) {
    const y = stack.pop(), x = stack.pop();
    if (seen[y * W + x]) continue;
    let lx = x, rx = x;
    while (lx > 0 && !seen[y * W + lx - 1] && match(y * W + lx - 1)) lx--;
    while (rx < W - 1 && !seen[y * W + rx + 1] && match(y * W + rx + 1)) rx++;
    for (let xx = lx; xx <= rx; xx++) {
      const q = y * W + xx; seen[q] = 1; const k = q * 4; d[k] = r1; d[k + 1] = g1; d[k + 2] = b1; d[k + 3] = 255;
      if (y > 0 && !seen[q - W] && match(q - W)) stack.push(xx, y - 1);
      if (y < H - 1 && !seen[q + W] && match(q + W)) stack.push(xx, y + 1);
    }
  }
  ctx.putImageData(img, 0, 0);
}
function repaint() {
  if (!canvas || !canvas.isConnected) return;
  const ctx = canvas.getContext("2d", {willReadFrequently: true});
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (const op of localOps) { if (op.k === "f") floodFill(ctx, op.x, op.y, op.c); else strokeSeg(ctx, op, 0); }
}
function setupCanvas(cv) {
  canvas = cv;
  cv.width = 600; cv.height = 380;   // sharper on phones; coordinates are 0..1 anyway
  const wid = cv.dataset.wid;
  if (wid !== wordId) { wordId = wid; localOps = []; }
  repaint();
  let op = null, buf = [], timer = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [+Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)).toFixed(4), +Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)).toFixed(4)]; };
  const flush = () => { timer = null; if (op && buf.length) { send("dp", null, {id: op.id, p: buf, wid: +wordId}); buf = []; } };
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    const color = cv.dataset.color, w = +cv.dataset.w || 7, p = pos(e);
    if (cv.dataset.tool === "fill") {
      const f = {k: "f", c: color, x: p[0], y: p[1]}; localOps.push(f);
      floodFill(cv.getContext("2d", {willReadFrequently: true}), f.x, f.y, f.c);
      send("fill", null, {c: color, x: p[0], y: p[1], wid: +wordId}); return;
    }
    cv.setPointerCapture(e.pointerId);
    op = {k: "s", id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), c: color, w, p: [p]};
    localOps.push(op); strokeSeg(cv.getContext("2d"), op, 0);
    send("ds", null, {id: op.id, c: color, w, p: [p], wid: +wordId});
  });
  cv.addEventListener("pointermove", e => {
    if (!op) return;
    const p = pos(e); op.p.push(p); strokeSeg(cv.getContext("2d"), op, op.p.length - 1);
    buf.push(p); if (!timer) timer = setTimeout(flush, 60);
  });
  const end = () => { if (timer) { clearTimeout(timer); flush(); } op = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
}

start();

// ---------------------------------------------------------- no zoom on iPhone / iPad (Safari ignores user-scalable=no)
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive: false}));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, {passive: false});
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350 && !e.target.closest("input,textarea")) { e.preventDefault(); const b = e.target.closest("button,[data-ph-act]"); if (b) b.click(); }
  lastTouchEnd = now;
}, {passive: false});
document.addEventListener("dblclick", e => e.preventDefault(), {passive: false});
