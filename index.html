<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>جَمعة — ألعاب جماعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0d0a1d">
<style>
:root{
  --bg:#0d0a1d; --bg2:#151033; --panel:#1b1540; --line:#2c2462; --text:#f4f1ff; --dim:#a79fd0; --faint:#6d65a0;
  --coral:#ff6b6b; --amber:#ffc94d; --teal:#2ec4b6; --violet:#7b61ff; --pink:#ff5fa2; --green:#3ddc84;
  --tv-font:'Tajawal',system-ui,sans-serif; --display:'Lalezar','Tajawal',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,#2a1f6b 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#3b1347 0%,transparent 55%),var(--bg);
  color:var(--text);font-family:var(--tv-font);min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid #ffffff10}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:24px;
  background:conic-gradient(from 210deg,var(--coral),var(--amber),var(--teal),var(--violet),var(--coral));box-shadow:0 6px 18px #ff6b6b40}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.5px}
.brand small{color:var(--dim);font-size:12px;display:block;margin-top:-4px}
.topbar .sp{flex:1}
.chip-btn{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700}
.chip-btn:hover{background:#ffffff1a}
.chip-btn.primary{background:linear-gradient(90deg,var(--violet),var(--pink));border:none}
.store-badge{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.store-badge i{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block}
.store-badge.ok i{background:var(--green)}

/* ---------- layout ---------- */
.stage-wrap{display:grid;grid-template-columns:1fr 330px;gap:22px;padding:22px;align-items:start}
@media (max-width:1100px){.stage-wrap{grid-template-columns:1fr}}
.tv-col{min-width:0}
.tv-bezel{background:#05040c;border-radius:22px;padding:12px;box-shadow:0 30px 80px #00000080,inset 0 0 0 1px #ffffff12}
.tv-viewport{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#000}
#tv{position:absolute;top:0;right:0;width:1280px;height:720px;transform-origin:top right;overflow:hidden;
  background:radial-gradient(900px 500px at 90% 0%,#3a2a8f 0%,transparent 60%),radial-gradient(700px 500px at 0% 100%,#5a1e5e 0%,transparent 60%),linear-gradient(180deg,#140f33,#0c0921);}
.tv-stand{width:180px;height:14px;margin:0 auto;background:linear-gradient(#1a1730,#0b0a16);border-radius:0 0 10px 10px}
.below-tv{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
.hint{color:var(--faint);font-size:13px;text-align:center}
kbd{background:#ffffff14;border:1px solid #ffffff22;border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:12px;color:var(--dim)}

/* remote */
.remote{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#221c48,#16122f);border:1px solid #ffffff14;border-radius:999px;padding:8px 14px}
.dpad{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:3px}
.dpad button{border:none;border-radius:10px;background:#ffffff12;font-size:14px}
.dpad button:hover{background:#ffffff26}
.dpad .ok{border-radius:50%;background:var(--violet);font-weight:800;font-size:12px}
.remote .back{border:none;border-radius:999px;background:#ffffff12;padding:8px 14px;font-weight:700}

/* ---------- TV screens ---------- */
.screen{position:absolute;inset:0;padding:48px 64px;display:flex;flex-direction:column}
.screen.enter{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tv-head{display:flex;align-items:center;gap:16px}
.tv-title{font-family:var(--display);font-size:56px;line-height:1.1;margin:0}
.tv-sub{color:var(--dim);font-size:22px;margin:4px 0 0}
.f{outline:none;transition:transform .16s ease,box-shadow .16s ease,background .16s}
.f.focus{transform:scale(1.06);box-shadow:0 0 0 4px #fff,0 18px 40px #00000070;z-index:2}
.tv-btn{border:none;border-radius:18px;padding:16px 30px;font-size:24px;font-weight:800;background:#ffffff14;color:#fff}
.tv-btn.go{background:linear-gradient(90deg,var(--coral),var(--amber));color:#2a1200}
.tv-btn.alt{background:linear-gradient(90deg,var(--violet),var(--pink))}
.tv-btn[disabled]{opacity:.4}
.tv-row{display:flex;gap:18px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:#ffffff12;border:1px solid #ffffff1c;border-radius:999px;padding:6px 16px;font-size:18px;color:var(--dim)}

/* home */
.home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:auto;margin-bottom:auto}
.game-card{border:none;border-radius:28px;height:300px;padding:28px;text-align:right;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;color:#fff}
.game-card .ico{position:absolute;top:22px;left:24px;font-size:84px;filter:drop-shadow(0 10px 20px #0005)}
.game-card h3{font-family:var(--display);font-weight:400;font-size:40px;margin:0}
.game-card p{margin:6px 0 0;font-size:18px;opacity:.85;line-height:1.5}
.gc1{background:linear-gradient(150deg,#ff8a5b,#ff3d7f)}
.gc2{background:linear-gradient(150deg,#5b8cff,#7b3dff)}
.gc3{background:linear-gradient(150deg,#22c1a3,#127a8f)}
.gc4{background:linear-gradient(150deg,#3a3168,#221b4a);box-shadow:inset 0 0 0 2px #ffffff1a}
.home-foot{display:flex;justify-content:space-between;color:var(--faint);font-size:16px}

/* lobby */
.lobby{display:grid;grid-template-columns:400px 1fr;gap:44px;flex:1;margin-top:28px;min-height:0}
.join-card{background:#ffffff0c;border:1px solid #ffffff18;border-radius:28px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qr{background:#fff;border-radius:18px;padding:14px;width:220px;height:220px;display:grid;place-items:center}
.qr img,.qr canvas{width:192px!important;height:192px!important}
.room-code{font-family:var(--display);font-size:54px;letter-spacing:8px;line-height:1;direction:ltr}
.join-card .small{color:var(--dim);font-size:17px;line-height:1.6}
.players-area{display:flex;flex-direction:column;min-height:0}
.players-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;align-content:start;flex:1}
.pcard{background:#ffffff0d;border:1px solid #ffffff16;border-radius:22px;padding:16px 10px;text-align:center;position:relative;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.avatar{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:40px;margin:0 auto 8px;box-shadow:0 8px 20px #0005}
.pcard .nm{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .via{font-size:14px;color:var(--dim)}
.pcard.empty{border-style:dashed;color:var(--faint);display:grid;place-items:center;min-height:150px;font-size:18px;animation:none}
.add-card{border:2px dashed #ffffff30;background:transparent;border-radius:22px;color:var(--dim);font-size:20px;font-weight:700;min-height:150px}

/* categories */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px}
.cat{border:none;border-radius:22px;padding:22px;background:#ffffff10;text-align:right;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.cat .e{font-size:48px}
.cat .n{font-size:26px;font-weight:800}
.cat .c{font-size:15px;color:var(--dim)}
.empty-state{margin:auto;text-align:center;color:var(--dim);font-size:24px;line-height:1.7}

/* game common */
.topline{display:flex;align-items:center;justify-content:space-between;gap:16px}
.timer{font-family:var(--display);font-size:42px;min-width:120px;text-align:center;background:#ffffff12;border-radius:18px;padding:4px 18px;direction:ltr}
.timer.low{color:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.bar{height:10px;background:#ffffff14;border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--coral));border-radius:99px;transition:width 1s linear}
.minis{display:flex;gap:8px;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:6px;background:#ffffff10;border-radius:999px;padding:4px 12px 4px 6px;font-size:17px;font-weight:700}
.mini .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.mini.done{background:#3ddc8426;box-shadow:inset 0 0 0 2px #3ddc8466}

/* QA */
.question{font-size:46px;font-weight:800;line-height:1.45;margin:30px 0 26px;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{border:none;border-radius:22px;padding:22px 26px;font-size:30px;font-weight:800;color:#fff;display:flex;align-items:center;gap:16px;text-align:right;min-height:96px}
.opt .k{width:50px;height:50px;border-radius:14px;background:#0003;display:grid;place-items:center;font-family:var(--display);font-size:28px;flex:none}
.o0{background:#e8466b}.o1{background:#3e7bfa}.o2{background:#f2a516}.o3{background:#1fb589}
.opt.dim{opacity:.25;filter:grayscale(.6)}
.opt.right{box-shadow:0 0 0 5px #fff,0 0 40px #3ddc84aa}
.reveal-list{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.res{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px 6px 8px;font-size:19px;font-weight:700;background:#ffffff10}
.res.ok{background:#3ddc8430}.res.no{background:#ff6b6b26}
.res .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.award{border:none;border-radius:999px;padding:8px 16px 8px 10px;font-size:19px;font-weight:700;background:#ffffff14;display:flex;align-items:center;gap:8px}
.award.on{background:var(--green);color:#062b14}

/* charades */
.actor-hero{margin:auto;text-align:center}
.actor-hero .avatar{width:150px;height:150px;font-size:84px}
.actor-hero h2{font-family:var(--display);font-weight:400;font-size:64px;margin:16px 0 4px}
.actor-hero p{font-size:24px;color:var(--dim);margin:0}
.word-box{font-family:var(--display);font-size:80px;background:#fff;color:#1b1540;border-radius:26px;padding:10px 46px;display:inline-block;margin-top:20px}
.word-hidden{font-size:24px;color:var(--dim);border:2px dashed #ffffff30;border-radius:22px;padding:22px 30px;display:inline-block;margin-top:20px}
.guessers{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.guesser{border:none;border-radius:22px;padding:12px 18px;background:#ffffff12;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.guesser .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:26px}
.big-timer{font-family:var(--display);font-size:140px;line-height:1;direction:ltr}
.reply-box{max-width:820px}.reply-q{color:#c4b5fd;font-size:22px;margin:6px 0 14px}.reply-t{background:#ffffff12;border-radius:16px;padding:18px 22px;font-size:28px;line-height:1.6;white-space:pre-wrap}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:90px;color:#fff;text-shadow:0 10px 40px #000a;pointer-events:none;animation:toast 1.1s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* scores */
.board{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.row{display:grid;grid-template-columns:56px 60px 220px 1fr 110px;align-items:center;gap:14px;font-size:26px;font-weight:800}
.row .rk{font-family:var(--display);font-size:36px;color:var(--dim);text-align:center}
.row .av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px}
.row .track{height:26px;background:#ffffff10;border-radius:99px;overflow:hidden}
.row .track i{display:block;height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.row .pts{font-family:var(--display);font-size:36px;text-align:left;direction:ltr}
.row.first .rk{color:var(--amber)}

/* modal on tv */
.tv-modal{position:absolute;inset:0;background:#0009;display:grid;place-items:center;z-index:5}
.tv-modal .box{background:#1d1745;border:1px solid #ffffff22;border-radius:28px;padding:34px;width:720px}
.tv-modal h3{font-family:var(--display);font-weight:400;font-size:40px;margin:0 0 16px}
.tv-input{width:100%;font-size:30px;padding:14px 20px;border-radius:16px;border:2px solid #ffffff30;background:#0d0a1d;color:#fff}
.tv-input:focus,.tv-input.focus{border-color:var(--amber);outline:none}
.sugg{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.sugg button{border:none;border-radius:999px;background:#ffffff14;padding:8px 18px;font-size:20px;font-weight:700}

/* ---------- phones ---------- */
.phones-col h2{font-size:16px;color:var(--dim);margin:2px 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.phones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.phones-col{min-width:0}
.phone{min-width:0}
@media (max-width:1100px){.phones{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.phone{background:#05040c;border-radius:26px;padding:7px;box-shadow:0 14px 30px #0007,inset 0 0 0 1px #ffffff18}
.phone .scr{height:290px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#1d1648,#120e2c);display:flex;flex-direction:column;padding:12px;position:relative}
.phone .notch{width:54px;height:6px;background:#000;border-radius:9px;margin:0 auto 8px}
.phone .ph-title{font-weight:800;font-size:14px;text-align:center;margin-bottom:8px}
.phone .ph-dim{color:var(--dim);font-size:12px;text-align:center;line-height:1.5}
.phone input{width:100%;border-radius:10px;border:1px solid #ffffff2a;background:#0d0a1d;color:#fff;padding:8px;font-size:14px;text-align:center}
.phone .avs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}
.phone .avs button{border:none;border-radius:9px;background:#ffffff10;font-size:17px;padding:4px 0}
.phone .avs button.sel{background:var(--violet)}
.phone .pbtn{border:none;border-radius:12px;padding:10px;font-weight:800;font-size:14px;background:linear-gradient(90deg,var(--coral),var(--amber));color:#2a1200;width:100%;margin-top:auto}
.phone .pbtn.ghost{background:#ffffff14;color:#fff}
.phone .popts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.phone .popts button{border:none;border-radius:12px;min-height:62px;font-size:12px;font-weight:800;color:#fff;padding:6px;line-height:1.3}
.phone .center{margin:auto;text-align:center}
.phone .big{font-size:44px}
.phone .pword{font-family:var(--display);font-size:30px;background:#fff;color:#1b1540;border-radius:14px;padding:6px 10px;margin:8px 0}
.phone .who{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--dim);margin-bottom:6px}
.phone .who .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.phone-add{border:2px dashed #ffffff26;background:transparent;border-radius:26px;color:var(--dim);font-weight:700;min-height:120px}
.note{background:#ffffff08;border:1px solid #ffffff14;border-radius:16px;padding:12px 14px;color:var(--dim);font-size:13px;line-height:1.7;margin-top:14px}

/* ---------- admin ---------- */
.admin{position:fixed;inset:0;background:#0b0918f2;backdrop-filter:blur(6px);z-index:50;display:none;flex-direction:column}
.admin.open{display:flex}
.admin-head{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid #ffffff12}
.admin-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px}
.admin-body{display:grid;grid-template-columns:330px 1fr;flex:1;min-height:0}
.cat-list{border-left:1px solid #ffffff12;overflow:auto;padding:16px}
.cat-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;cursor:pointer;margin-bottom:6px;background:#ffffff06}
.cat-item:hover{background:#ffffff10}
.cat-item.sel{background:#7b61ff33;box-shadow:inset 0 0 0 1px #7b61ff88}
.cat-item .e{font-size:24px}
.cat-item .n{font-weight:800;flex:1}
.cat-item .t{font-size:11px;color:var(--dim)}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:#ffffff12;color:var(--dim)}
.tag.qa{background:#3e7bfa33;color:#a9c4ff}.tag.ch{background:#ff6b6b2e;color:#ffb0b0}
.switch{width:38px;height:22px;border-radius:99px;background:#ffffff22;position:relative;border:none;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--green)}
.switch.on::after{right:19px}
.editor{overflow:auto;padding:20px 26px}
.card2{background:#ffffff08;border:1px solid #ffffff14;border-radius:18px;padding:16px;margin-bottom:16px}
.card2 h4{margin:0 0 10px;font-size:16px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form-row > *{flex:1;min-width:120px}
.in{background:#0d0a1d;border:1px solid #ffffff22;border-radius:10px;color:#fff;padding:9px 12px;font-size:14px}
.in:focus{outline:none;border-color:var(--violet)}
textarea.in{width:100%;min-height:90px;resize:vertical;line-height:1.6}
.btn{border:none;border-radius:10px;padding:9px 16px;font-weight:800;font-size:14px;background:#ffffff14;flex:none!important;min-width:0!important}
.btn.pri{background:linear-gradient(90deg,var(--violet),var(--pink))}
.btn.ok{background:var(--green);color:#062b14}
.btn.danger{background:#ff6b6b26;color:#ffb0b0}
.items{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.item{display:flex;align-items:center;gap:10px;background:#ffffff08;border-radius:10px;padding:8px 12px;font-size:14px}
.item .q{flex:1}
.item .a{color:var(--green);font-size:12px}
.item .x{border:none;background:none;color:var(--faint);font-size:16px}
.item .x:hover{color:var(--coral)}
.muted{color:var(--dim);font-size:13px;line-height:1.7}
.status-line{font-size:13px;color:var(--amber);min-height:18px;margin-top:8px}
footer{color:var(--faint);font-size:12px;text-align:center;padding:10px 0 22px}

/* ---------- v2 additions ---------- */
.home-grid{grid-template-columns:repeat(4,1fr);gap:22px}
.game-card{height:205px;padding:20px 24px}
.game-card .ico{font-size:66px;top:18px;left:20px}
.game-card h3{font-size:34px}
.game-card p{font-size:16px}
.gc5{background:linear-gradient(150deg,#8b5cf6,#d946ef)}
.gc6{background:linear-gradient(150deg,#f59e0b,#ef4444)}
.gc7{background:linear-gradient(150deg,#06b6d4,#3b82f6)}
.quit{border:none;border-radius:999px;padding:8px 18px;font-size:18px;font-weight:800;background:#ffffff14;color:#ffb0b0}
.tv-btn.ghost{background:#ffffff10}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 0 #3ddc8488;animation:live 1.6s infinite}
@keyframes live{70%{box-shadow:0 0 0 10px #3ddc8400}100%{box-shadow:0 0 0 0 #3ddc8400}}
.banner{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#3ddc84;color:#062b14;font-weight:800;font-size:20px;border-radius:999px;padding:8px 22px;z-index:6;animation:fadeIn .3s}
.confirm .box{text-align:center}
.confirm p{font-size:22px;color:var(--dim);margin:0 0 22px}
/* salfa */
.role-panel{margin:auto;text-align:center}

let timerId = null;

  g.endsAt = Date.now() + seconds * 1000; g.total = g.total && g.resuming ? g.total : seconds; g.onEnd = onEnd; g.resuming = false;
  timerId = setInterval(() => {
    const left = timeLeft();

    tick();

}

function pauseTimer() { const g = S.game; if (g && timerId) { g.pausedMs = Math.max(0, g.endsAt - Date.now()); stopTimer(); } }

function fibNext() {
  const g = S.game; g.idx++;
  if (g.idx >= g.items.length) { endGame(); return; }
  Used.add("fib", g.items[g.idx]);

  startTimer(cfg("fib").secs, fibToVote);
  render(true);

  const g = S.game; if (!g || g.type !== "fib" || g.phase !== "write") return "closed";
  text = String(text || "").trim().slice(0, 40);
  if (!text) return "empty";
  if (norm(text) === norm(g.items[g.idx].a)) { g.reject[pid] = true; render(); return "truth"; }
  g.lies[pid] = text; delete g.reject[pid];

  render(); return "ok";
}

function mfPick(pid, v) {

function mfTally() {

function startGame(type, cat) {
  cat = {id: cat.id, name: cat.name, emoji: cat.emoji, type: cat.type, items: cat.items.slice()};
  if (!cat.items.length) return;
  ({qa: startQA, charades: startCharades, salfa: startSalfa, fib: startFib, draw: startDraw, pics: startPics, letters: startLetters, mafia: startMafia})[type](cat);
}
function endGame() { stopTimer(); S.game = null; beep("end"); go("scores"); }
function gameReady(type) {
  const G = GAMES[type]; if (!G) return {ok: true};
  if (S.players.length < G.min) return {ok: false, why: `تحتاج ${G.min} لاعبين على الأقل`};
  if (phonePlayers().length < G.minPhones) return {ok: false, why: `تحتاج ${G.minPhones === 1 ? "لاعب واحد" : G.minPhones + " لاعبين"} على الأقل من الجوال`};

  return {ok: true};
}

    bottom = `<div class="reveal-list">${res}</div>${awards}

function screenSalfa() {
  const g = S.game, info = `الجولة ${g.round} من ${g.rounds}`;
  const imp = playerById(g.impostor);
  const topic = `<span class="pill topic">🧭 الموضوع: <b>${esc(g.topic)}</b></span>`;
  if (g.phase === "roles") {
    if (S.reveal) {
      const p = playerById(S.reveal), isImp = p.id === g.impostor;
      return `<div class="screen">${head(info, topic)}<div class="role-panel">${av(p, "avatar")}<h2 class="tv-title" style="font-size:44px;margin-top:10px">لـ${esc(p.name)} فقط 👀</h2>
        <div class="role-card ${isImp ? "imp" : ""}">${esc(salfaRoleText(p.id))}</div><p class="tv-sub" style="margin-top:10px">الموضوع: <b style="color:var(--amber)">${esc(g.topic)}</b></p>
        <p class="tv-sub" style="margin-top:14px">${isImp ? "حاول تعرف الكلمة من أسئلتهم بدون ما تنكشف!" : "لا تقولها! اسأل وجاوب بذكاء"}</p>
        <div class="tv-row" style="justify-content:center;margin-top:24px"><button class="tv-btn go f" data-f="r-hide" data-act="salfaSeen" data-v="${p.id}" data-auto="1">خلاص شفت ✓ إخفاء</button></div></div></div>`;
    }
    const all = S.players.every(p => g.seen[p.id]);
    const fu = S.players.find(p => !p.phone && !g.seen[p.id]), firstUnseen = fu && fu.id;
    const chips = S.players.map(p => p.phone
      ? `<span class="seen ${g.seen[p.id] ? "ok" : ""}">${av(p)}${esc(p.name)} 📱</span>`
      : `<button class="seen f ${g.seen[p.id] ? "ok" : ""}" data-f="sr-${p.id}" data-act="salfaReveal" data-v="${p.id}" ${!g.seen[p.id] && p.id === firstUnseen ? 'data-auto="1"' : ""}>${av(p)}${esc(p.name)} 👁</button>`).join("");
    return `<div class="screen">${head(info, topic)}<div class="role-panel"><div style="font-size:80px">🕵️</div><h2 class="tv-title">الموضوع: <span style="color:var(--amber)">${esc(g.topic)}</span></h2><p class="tv-sub" style="font-size:26px;margin-bottom:6px">كل واحد يشوف دوره السري — واحد منكم برا السالفة!</p>
      <p class="tv-sub">أصحاب الجوالات يشوفونه في جوالاتهم · لاعبين الريموت: اختر اسمك والباقين يغمضون</p>
      <div class="seen-list">${chips}</div>
      <div class="tv-row" style="justify-content:center;margin-top:30px"><button class="tv-btn go f" data-f="s-ask" data-act="salfaAsk" ${all ? 'data-auto="1"' : ""}>${all ? "الكل شاف — ابدأوا الأسئلة ←" : "ابدأ الأسئلة على أي حال ←"}</button></div></div></div>`;
  }
  if (g.phase === "ask") {
    const left = timeLeft(), A = playerById(g.pair[0]), B = playerById(g.pair[1]);
    return `<div class="screen">${head(info, topic + `<div class="timer ${timed() && left <= 10 ? "low" : ""}" id="tTimer">${tl(left)}</div>`)}
      ${timed() ? `<div class="bar"><i id="tBar" style="width:${barW(left)}%"></i></div>` : ""}
      <p class="tv-sub" style="text-align:center;margin-top:20px">سؤال رقم ${g.asked} · الموضوع: <b style="color:var(--amber)">${esc(g.topic)}</b> — لا تفضحون الكلمة 🤐</p>
      <div class="ask-pair">${av(A, "avatar")}<div class="ask-mid"><div class="ask-name">${esc(A.name)}</div><div class="ask-arrow">يسأل ←</div><div class="ask-name">${esc(B.name)}</div></div>${av(B, "avatar")}</div>
      <div class="tv-row" style="justify-content:center;margin-top:auto;gap:22px"><button class="tv-btn go f" data-f="s-nextq" data-act="salfaNextQ" data-auto="1">🎲 سؤال ثاني</button>
        <button class="tv-btn alt f" data-f="s-vote" data-act="salfaVote">🗳 التصويت الآن</button></div></div>`;
  }
  if (g.phase === "vote") {
    const counts = {}; Object.values(g.votes).forEach(t => counts[t] = (counts[t] || 0) + 1);
    const voted = phonePlayers().map(p => `<span class="mini ${g.votes[p.id] ? "done" : ""}">${av(p)}${esc(p.name)}</span>`).join("");
    const order = S.players.slice().sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
    return `<div class="screen">${head(info, topic)}
      <h2 class="tv-title" style="text-align:center;margin-top:16px">مين برا السالفة؟ 🕵️</h2>
      <p class="tv-sub" style="text-align:center">صوّتوا من الجوالات — بعدين اختاروا المتهم النهائي بالريموت</p>
      <div class="minis" style="justify-content:center;margin-top:14px">${voted}</div>
      <div class="guessers" style="margin-top:auto">${order.map((p, i) => `<button class="guesser vote-chip f" data-f="ac-${p.id}" data-act="salfaAccuse" data-v="${p.id}" ${i === 0 ? 'data-auto="1"' : ""}>${av(p)}${esc(p.name)} <span class="cnt">${counts[p.id] || 0}</span></button>`).join("")}</div></div>`;
  }
  if (g.phase === "guess") {
    return `<div class="screen">${head(info, topic)}<div style="text-align:center;margin-top:20px">${av(imp, "avatar")}
      <h2 class="tv-title" style="margin-top:10px">كشفتوه! 🎉 ${esc(imp.name)} برا السالفة</h2>
      <p class="tv-sub">آخر فرصة له: يخمّن الكلمة ويكسب 150 نقطة ${imp.phone ? "(يختار من جواله أو هنا)" : ""}</p></div>
      <div class="guess-grid">${g.guessOpts.map((w, i) => `<button class="f" data-f="gw-${i}" data-act="salfaGuess" data-v="${i}" ${i === 0 ? 'data-auto="1"' : ""}>${esc(w)}</button>`).join("")}</div></div>`;
  }
  const caught = g.accused === g.impostor, last = g.round >= g.rounds;
  const guessed = g.guessPick != null && g.guessOpts[g.guessPick] === g.word;
  return `<div class="screen">${head(info, topic)}<div class="role-panel">${av(imp, "avatar")}
    <h2 class="tv-title" style="margin-top:10px">${caught ? (guessed ? "كشفتوه… بس خمّن الكلمة! 😏" : "كشفتوه! 🎉") : "برا السالفة فاز! 😈"}</h2>
    <p class="tv-sub">${esc(imp.name)} كان برا السالفة · الكلمة كانت</p><div class="role-card">${esc(g.word)}</div>
    <p class="tv-sub" style="margin-top:12px">${caught ? "الكل +100" + (guessed ? " · " + esc(imp.name) + " +150" : "") : esc(imp.name) + " +200"}</p>
    <div class="tv-row" style="justify-content:center;margin-top:20px"><button class="tv-btn go f" data-f="s-next" data-act="salfaNext" data-auto="1">${last ? "النتائج 🏆" : "الجولة التالية ←"}</button></div></div></div>`;
}

// ---------------------------------------------------------- remote focus navigation
let cur = null;
function focusKey() { return cur && cur.isConnected ? cur.dataset.f : null; }
function focusables() {
  let list = [...tv.querySelectorAll(".f")].filter(el => !el.disabled && el.offsetParent !== null);
  if (S.modal) list = list.filter(el => el.closest(".tv-modal"));
  return list;
}
function setFocus(el) { if (cur) cur.classList.remove("focus"); cur = el; if (el) { el.classList.add("focus"); if (el.closest(".home-grid")) try { el.scrollIntoView({block: "nearest", behavior: "smooth"}); } catch (e) { } } }
function restoreFocus(key) {
  const list = focusables();
  let el = key && list.find(e => e.dataset.f === key);
  if (!el) el = list.find(e => e.dataset.auto) || list.find(e => e.dataset.f !== "x-quit" && e.dataset.f !== "x-rep") || list[0] || null;
  setFocus(el);
}
let hexAnchorX = null;
function hexMove(dir, list) {
  const hexes = list.filter(el => el.classList.contains("hex")), scale = tvScale();
  const pos = el => { const r = el.getBoundingClientRect(); return {x: (r.left + r.right) / 2 / scale, y: (r.top + r.bottom) / 2 / scale}; };
  const c = pos(cur);
  if (dir === "ArrowLeft" || dir === "ArrowRight") {
    hexAnchorX = null;
    const same = hexes.filter(el => el !== cur && Math.abs(pos(el).y - c.y) < 10 && (dir === "ArrowRight" ? pos(el).x > c.x : pos(el).x < c.x));
    if (!same.length) return null;   // نهاية الصف → خلّ الحركة العادية (تطلع للأزرار)
    return same.sort((a, b) => Math.abs(pos(a).x - c.x) - Math.abs(pos(b).x - c.x))[0];
  }
  const up = dir === "ArrowUp";
  const rows = hexes.filter(el => up ? pos(el).y < c.y - 10 : pos(el).y > c.y + 10);
  if (!rows.length) return null;
  const nextY = rows.map(el => pos(el).y).sort((a, b) => up ? b - a : a - b)[0];   // أقرب صف فقط
  const row = rows.filter(el => Math.abs(pos(el).y - nextY) < 10);
  if (hexAnchorX == null) hexAnchorX = c.x;
  return row.sort((a, b) => (Math.abs(pos(a).x - hexAnchorX) - Math.abs(pos(b).x - hexAnchorX)) || (pos(a).x - pos(b).x))[0];
}
function moveFocus(dir) {
  const list = focusables();
  if (!cur || !cur.isConnected || !list.includes(cur)) { restoreFocus(null); return; }
  if (cur.classList.contains("hex")) { const h = hexMove(dir, list); if (h) { setFocus(h); beep("tick"); return; } }
  else hexAnchorX = null;
  const scale = tvScale();
  const r0 = cur.getBoundingClientRect(), cx = (r0.left + r0.right) / 2, cy = (r0.top + r0.bottom) / 2;
  let best = null, bestScore = Infinity;
  for (const el of list) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect(), x = (r.left + r.right) / 2, y = (r.top + r.bottom) / 2;
    const dx = (x - cx) / scale, dy = (y - cy) / scale;
    let main, side;
    if (dir === "ArrowRight") { if (dx <= 4) continue; main = dx; side = Math.abs(dy); }
    else if (dir === "ArrowLeft") { if (dx >= -4) continue; main = -dx; side = Math.abs(dy); }
    else if (dir === "ArrowDown") { if (dy <= 4) continue; main = dy; side = Math.abs(dx); }
    else { if (dy >= -4) continue; main = -dy; side = Math.abs(dx); }
    const score = main + side * 2.2;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) { setFocus(best); beep("tick"); }
}
function pressKey(key) {
  if (key === "Enter") { if (cur && cur.isConnected) cur.click(); else restoreFocus(null); }
  else if (key === "Escape" || key === "Backspace") back();
  else moveFocus(key);
}
document.addEventListener("keydown", e => {
  const inField = e.target.matches && e.target.matches("input,textarea,select");
  if (inField && !e.target.closest("#tv")) return;
  if (inField) {
    if (e.key === "Enter") { e.preventDefault(); act("addTyped"); }
    else if (e.key === "Escape") { e.preventDefault(); back(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); e.target.blur(); moveFocus("ArrowDown"); }
    return;
  }
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", "Escape", "Backspace"].includes(e.key)) { e.preventDefault(); pressKey(e.key); }
});
document.querySelectorAll(".remote [data-key]").forEach(b => b.addEventListener("click", () => pressKey(b.dataset.key)));

function act(name, v, el) {
  switch (name) {
    case "choose": { const [t, sec] = String(v || "").split("|"); chooseGame(t || null, sec); break; }
    case "go": go(v); break;
    case "toCats": if (gameReady(S.next).ok) { if (GAMES[S.next].nobank) { S.pendingCat = {id: "_" + S.next, name: GAMES[S.next].name, emoji: GAMES[S.next].icon, type: S.next, items: [{}]}; go("setup"); } else go("cats"); } break;
    case "addRemote": S.modal = "addPlayer"; render(true); break;
    case "closeModal": S.modal = null; render(true); break;
    case "addNamed": addPlayer(v, null, false); S.modal = null; render(true); break;
    case "addTyped": { const inp = $("#remoteName"); const n = inp && inp.value.trim(); if (n) { addPlayer(n, null, false); S.modal = null; render(true); } else if (inp) inp.focus(); break; }
    case "setOpt": { const [k, val] = String(v).split(":"); S.cfg[S.next][k] = +val; saveCfg(); render(); break; }
    case "startPending": if (S.pendingCat) startGame(S.next, S.pendingCat); break;
    case "delPlayer": removePlayer(v); render(true); break;
    case "delAll": if (!S.confirmAll) { S.confirmAll = true; render(); setTimeout(() => { S.confirmAll = false; render(); }, 4000); } else { S.confirmAll = false; S.players.map(p => p.id).forEach(removePlayer); render(true); } break;
    case "salfaNextQ": salfaNextQ(); break;
    case "chEnd": chEnd(); break;
    case "drEnd": drEnd(); break;
    case "picsWin": picsWin(v); break;
    case "picsReveal": picsReveal(); break;
    case "picsNext": picsNext(); break;
    case "ltPick": ltPick(v); break;
    case "ltAward": ltAward(v); break;

    case "ltNextRound": ltNextRound(); break;
    case "ltSwap": ltSwap(v); break;
    case "ltBegin": ltBegin(); break;
    case "mfNight": mfNight(); break;

      else cat = Bank.get(v);

    }
    case "openQuit": openQuit(); break;
    case "reportItem": reportItem(); break;
    case "reportSend": reportSend(v); break;
    case "replySeen": replySeen(); break;
    case "closeReport": closeReport(); break;
    case "closeQuit": closeQuit(); break;
    case "quitGame": quitGame(); break;
    case "reveal": revealAnswer(); break;
    case "nextQ": nextQuestion(); break;
    case "award": toggleAward(v); break;
    case "chStart": chStart(); break;

const phoneCache = {};
function renderPhones() {
  if (!roomRef) return;
  for (const ph of phones) {
    const html = phoneHTML(ph);
    if (phoneCache[ph.id] === html) continue;
    phoneCache[ph.id] = html;
    roomRef.child("views/" + ph.id).set({h: html, t: Date.now()});
  }
}
function phoneAct(ph, a, v) {
  const g = S.game;
  if (a === "ans") return phoneAnswer(ph.pid, +v);
  if (a === "pans") return picsAnswer(ph.pid, +v);
  if (a === "buzz") return ltBuzz(ph.pid);
  if (a === "team") return ltJoinTeam(ph.pid, v);
  if (a === "ready") return ltReady(ph.pid);
  if (a === "chSkip") { if (g && g.type === "charades" && chActor() && chActor().id === ph.pid) chSkip(); return; }
  if (a === "chReady") { if (g && g.type === "charades" && chActor() && chActor().id === ph.pid) chStart(); return; }
  if (a === "drReady") { if (g && g.type === "draw" && drawer() && drawer().id === ph.pid) drStart(); return; }
  if (a === "mfseen") return mfSeen(ph.pid);
  if (a === "mfpick") return mfPick(ph.pid, v);
  if (a === "mfvote") return mfVote(ph.pid, v);
  if (a === "seen") return salfaSeen(ph.pid);
  if (a === "vote") return salfaPhoneVote(ph.pid, v);
  if (a === "sguess") { if (g && g.impostor === ph.pid) salfaGuess(+v); return; }
  if (a === "lie") { const r = fibSubmit(ph.pid, ph.lie); if (r === "ok") ph.lie = ""; return; }
  if (a === "fvote") return fibVote(ph.pid, +v);
  if (a === "funvote") return fibUnvote(ph.pid);
  const isDrawer = g && g.type === "draw" && drawer() && drawer().id === ph.pid;
  if (a === "ink") { if (isDrawer) g.color = v; renderPhones(); return; }
  if (a === "tool") { if (isDrawer) g.tool = v; renderPhones(); return; }
  if (a === "size") { if (isDrawer) { g.size = v; g.tool = "brush"; } renderPhones(); return; }
  if (a === "undo") { if (isDrawer) { g.ops.pop(); repaintAll(); } return; }
  if (a === "clear") { if (isDrawer) { g.ops = []; repaintAll(); } return; }
  if (a === "drSkip") { if (isDrawer) drSkip(); return; }
  if (a === "guess") {
    const txt = ph.guess || ""; if (!txt.trim()) return;
    const ok = drGuess(ph.pid, txt); ph.guess = ""; ph.fb = ok ? "صح! 🎉" : "«" + txt.trim() + "» غلط، جرّب ثاني";

function drawFromPhone(ph, a) {
  const g = S.game;
  if (!g || g.type !== "draw" || g.phase !== "drawing" || !drawer() || drawer().id !== ph.pid) return;
  if (a.wid != null && a.wid !== (g.wordNo || 0)) return;   // stroke belongs to an old word
  const ctx = c => c.getContext("2d", {willReadFrequently: true});
  const hideHint = () => { const ov = tv.querySelector(".canvas-box .ov"); if (ov) ov.remove(); };
  const pts = Array.isArray(a.p) ? a.p.filter(p => Array.isArray(p) && p.length === 2).map(p => [+p[0], +p[1]]) : [];
  if (a.a === "ds" && pts.length) {
    const op = {k: "s", c: String(a.c || "#1b1540"), w: Math.min(20, +a.w || 7), p: pts, sid: a.id}; g.ops.push(op); hideHint();
    drawCanvases().forEach(c => strokeSeg(ctx(c), op, 0));
  } else if (a.a === "dp" && pts.length) {
    const op = g.ops.find(o => o.sid === a.id); if (!op) return;
    const from = op.p.length; op.p.push(...pts);
    drawCanvases().forEach(c => strokeSeg(ctx(c), op, from));
  } else if (a.a === "fill") {
    const f = {k: "f", c: String(a.c || "#1b1540"), x: +a.x, y: +a.y}; g.ops.push(f); hideHint();
    drawCanvases().forEach(c => floodFill(ctx(c), f.x, f.y, f.c));
  }
}

      if (snap.val() === true) {
        roomRef.child("meta").onDisconnect().update({online: false});
        roomRef.child("meta").update({online: true, alive: Date.now()});
      }
    });
    setInterval(() => roomRef.child("meta/alive").set(Date.now()), 30000);
    // bring back the players (and their points) saved for this room
    const roster = (await roomRef.child("roster").get()).val() || {};
    Object.entries(roster).sort((x, y) => (x[1].i || 0) - (y[1].i || 0)).forEach(([id, r]) => {
      if (playerById(id)) return;
      S.players.push({id, name: String(r.name || "لاعب").slice(0, 14), avatar: r.avatar || AVATARS[0], color: r.color || COLORS[S.players.length % COLORS.length], score: +r.score || 0, phone: !!r.phone});
      if (r.phone && !phones.find(p => p.id === id)) phones.push({id, pid: id, lie: "", guess: "", fb: ""});
    });
    roomRef.child("players").on("child_added", s => onPhoneJoin(s.key, s.val() || {}));
    roomRef.root.child("rooms/REPORTS/reports").on("value", s => Reported.fromRoom(s.val()));
    roomRef.child("actions").on("child_added", s => { const a = s.val(); s.ref.remove(); try { onPhoneAction(a || {}); } catch (e) { console.error(e); } });
    ONLINE = true;
  } catch (e) { console.warn("offline:", e); ONLINE = false; }
  render();
}
// keep the screen awake (browser / tablet as host)
let wakeLock = null;
async function keepAwake() { try { if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) { } }
document.addEventListener("visibilitychange", keepAwake); document.addEventListener("click", keepAwake, {once: true}); keepAwake();
["gesturestart", "gesturechange"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive: false}));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
window.addEventListener("pagehide", () => { try { if (roomRef) roomRef.child("meta").update({online: false}); } catch (e) { } });

// ---------------------------------------------------------- intro (logo animation, never blocks the game)
(function intro() {
  const el = $("#intro"); if (!el) return;
  let done = false;
  const finish = () => { if (done) return; done = true; el.classList.add("out"); setTimeout(() => el.remove(), 600); };
  const imgs = [...el.querySelectorAll("img")];
  let started = false;
  const start = () => { if (started) return; started = true; el.classList.add("play"); setTimeout(finish, 2900); };
  Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(start);
  setTimeout(start, 1200);                 // slow network: start anyway
  setTimeout(finish, 5000);                // never stay longer than this
  window.addEventListener("keydown", finish, {once: true});
  el.addEventListener("click", finish);
  window.__introDone = () => done;
})();

// ---------------------------------------------------------- boot
Bank.onChange(kind => {
  if (kind === "remote") showBanner("🔄 وصلت تحديثات الأسئلة");
  if (S.screen === "cats" || S.screen === "home") render();
});
fitTV(); render(true);
initOnline();
setTimeout(fitTV, 300);
</script>
